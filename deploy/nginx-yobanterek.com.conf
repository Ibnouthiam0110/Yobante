# ── Yobante — Site vitrine — configuration nginx pour le VPS Contabo ──────
#
# À copier sur le serveur :
#   /etc/nginx/sites-available/yobante-site
# Activer :
#   ln -sf /etc/nginx/sites-available/yobante-site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ⚠️ Ordre important : déposer CE fichier tel quel (HTTP seul), obtenir le
# certificat avec certbot, et le laisser réécrire le fichier :
#   certbot --nginx -d yobanterek.com -d www.yobanterek.com
# Certbot ajoute lui-même le bloc 443 et la redirection HTTP → HTTPS.
# Écrire le bloc 443 à la main AVANT d'avoir le certificat empêche nginx de
# démarrer (fichier de certificat introuvable).

server {
    listen 80;
    listen [::]:80;

    # Domaine racine + www. Le back tourne sur api.yobanterek.com et
    # l'admin sur admin.yobanterek.com : aucun conflit de server_name.
    server_name yobanterek.com www.yobanterek.com;

    root /var/www/yobante-site;
    index index.html;

    # Les fichiers sont déposés par le workflow GitHub Actions, qui les
    # rend ensuite à www-data.

    # Le site n'utilise pas de routeur client, mais le fallback reste utile :
    # une URL inconnue renvoie la page plutôt qu'un 404 nginx brut.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets hashés par Vite (nom unique à chaque build) → cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jamais mis en cache : c'est lui qui pointe vers les nouveaux
    # assets, un cache ici servirait indéfiniment l'ancienne version du site.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Challenge ACME (certbot / Let's Encrypt). Doit passer AVANT la règle des
    # fichiers cachés : « /.well-known » commence par un point, et un simple
    # `location ~ /\.` le bloquerait — le certificat ne pourrait jamais être
    # émis ni renouvelé. Le préfixe `^~` l'emporte sur les locations regex.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yobante-site;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Ne jamais servir de fichier caché (.env, .git…) s'il traînait —
    # « .well-known » excepté, via une assertion négative.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── En-têtes de sécurité ──────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Le site embarque des PNG lourds (maquettes) : on laisse de la marge.
    client_max_body_size 2m;
}
